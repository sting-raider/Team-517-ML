[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team517-business-er"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.5", "catboost==1.2.10", "numpy==2.3.2", "rapidfuzz==3.14.5"]

[tool.setuptools.packages.find]
where = ["src"]
