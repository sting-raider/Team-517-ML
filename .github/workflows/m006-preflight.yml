name: m006-preflight

on:
  push:
    branches:
      - agent/m/M006-wide-hard-negatives
  workflow_dispatch:

jobs:
  drive-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify shared Drive raw download
        run: |
          python -m pip install --quiet gdown
          mkdir -p /tmp/team517/train
          gdown --fuzzy 'https://drive.google.com/file/d/1aV5sSICdqErwCNeMKoAmuoVXWlKycqRC/view?usp=sharing' -O /tmp/team517/train/train_source2.tsv
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/team517/train/train_source2.tsv')
          expected=489301488
          size=p.stat().st_size
          print(f'M006_PREFLIGHT source2_bytes={size} expected={expected}')
          if size != expected:
              raise SystemExit(f'bad size: {size}')
          with p.open('rb') as f:
              header=f.readline().decode('utf-8').rstrip()
          print('M006_PREFLIGHT header=' + header)
          PY
