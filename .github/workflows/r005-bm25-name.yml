name: r005-bm25-name

on:
  push:
    branches:
      - agent/r/R005-bm25-name
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb==1.5.5 numpy==2.3.2 gdown==5.2.0
      - name: Run R005 full-data calibration experiment
        env:
          PYTHONPATH: src
        run: |
          mkdir -p "$RUNNER_TEMP/r005-data" "$RUNNER_TEMP/r005-work"
          python experiments/r005_bm25_name.py \
            --download \
            --data-dir "$RUNNER_TEMP/r005-data" \
            --db "$RUNNER_TEMP/r005-work/r005.duckdb" \
            --out "$RUNNER_TEMP/r005-work/r005-result.json"
      - name: Print result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/r005-work/r005-result.json" ]; then
            cat "$RUNNER_TEMP/r005-work/r005-result.json"
          fi
      - name: Upload aggregate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r005-result
          path: ${{ runner.temp }}/r005-work/r005-result.json
          if-no-files-found: ignore
          retention-days: 3
