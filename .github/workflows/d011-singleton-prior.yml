name: D011 singleton prior

on:
  push:
    branches:
      - agent/d/D011-source1-singleton-prior
    paths:
      - tools/experiments/d011_singleton_prior.py
      - .github/workflows/d011-singleton-prior.yml

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gdown==5.2.0
      - name: Self-test analysis helper
        run: python tools/experiments/d011_singleton_prior.py --self-test
      - name: Download permitted challenge files
        run: |
          mkdir -p /tmp/team517/train
          gdown --id 1nMO8x7VhzYgEF9dAd0uRr-RhMub0BqjM -O /tmp/team517/train/train_source1.tsv
          gdown --id 1xllXi0svJ-j9GWVfSBsMt1c-HivrV6uo -O /tmp/team517/train/train_ground_truth.tsv
          test -s /tmp/team517/train/train_source1.tsv
          test -s /tmp/team517/train/train_ground_truth.tsv
          ls -lh /tmp/team517/train
      - name: Run D011 full source1 experiment
        run: |
          python tools/experiments/d011_singleton_prior.py \
            --source1 /tmp/team517/train/train_source1.tsv \
            --truth /tmp/team517/train/train_ground_truth.tsv \
            --out /tmp/d011.json
