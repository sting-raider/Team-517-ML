name: r020a-source-specific-frequency

on:
  push:
    branches:
      - agent/r/R020a-source-specific-frequency
  pull_request:\n    branches:\n      - main\n  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb==1.5.5 numpy==2.3.2 gdown==5.2.0

      - name: Environment diagnostics
        run: |
          python --version
          df -h .
          free -h

      - name: Run R020a full-data calibration experiment
        env:
          PYTHONPATH: src
        run: |
          mkdir -p "$RUNNER_TEMP/r020a-data" "$RUNNER_TEMP/r020a-work"
          python experiments/r020a_source_specific_frequency.py \
            --download \
            --data-dir "$RUNNER_TEMP/r020a-data" \
            --db "$RUNNER_TEMP/r020a-work/r020a.duckdb" \
            --out "$RUNNER_TEMP/r020a-work/r020a-result.json"

      - name: Print aggregate result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/r020a-work/r020a-result.json" ]; then
            cat "$RUNNER_TEMP/r020a-work/r020a-result.json"
          fi

      - name: Upload aggregate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r020a-result
          path: ${{ runner.temp }}/r020a-work/r020a-result.json
          if-no-files-found: ignore
          retention-days: 3
